<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramayana: The Living Wall</title>
<style>
:root{--void:#03040a;--gold:#e9c27a;--gold-dim:rgba(233,194,122,.45);--ink:#f6e7c4;--glass:rgba(12,9,22,.68);--hair:rgba(233,194,122,.3);color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--void:#03040a}}
:root[data-theme="dark"]{--void:#03040a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);overflow:hidden}
body{cursor:none;font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body.ui{cursor:default}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--void)}
#c{display:block;flex:none}
#bar{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,14px);display:flex;align-items:center;gap:4px;padding:8px 14px 12px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--hair);opacity:0;pointer-events:none;transition:opacity .45s ease,transform .45s ease}
body.ui #bar{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#bar button{appearance:none;border:0;background:none;color:var(--ink);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;opacity:.82;padding:0}
#bar button:hover{opacity:1;background:rgba(233,194,122,.12)}
#bar button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#bar button.off{opacity:.38}
#bar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#dots{display:flex;align-items:center;margin:0 4px}
#dots button{width:22px;height:28px}
#dots i{display:block;width:6px;height:6px;border-radius:50%;background:var(--gold-dim);transition:transform .4s,background .4s,box-shadow .4s}
#dots button.on i{background:var(--gold);box-shadow:0 0 10px var(--gold);transform:scale(1.5)}
#name{min-width:176px;text-align:center;font-size:16px;color:var(--gold);white-space:nowrap;padding:0 6px}
#prog{position:absolute;left:24px;right:24px;bottom:5px;height:2px;border-radius:2px;background:rgba(233,194,122,.16);overflow:hidden}
#prog b{display:block;height:100%;width:0;background:var(--gold)}
#help{position:fixed;right:28px;top:28px;padding:18px 22px;border-radius:14px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--hair);font-size:15px;line-height:1.75;display:none;max-width:330px}
#help.show{display:block}
#help h2{margin:0 0 6px;font-size:18px;font-weight:500;color:var(--gold)}
#help kbd{display:inline-block;min-width:26px;padding:0 6px;margin-right:8px;border:1px solid var(--hair);border-radius:6px;text-align:center;font-family:inherit;color:var(--gold)}
#toast{position:fixed;left:50%;top:30px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--hair);font-size:15px;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.show{opacity:1}
</style>
<script src="assets/manifest.js"></script>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="Animated Ramayana mural"></canvas></div>
<div id="bar" role="toolbar" aria-label="Playback controls">
<button id="bPrev" aria-label="Previous chapter" title="Previous chapter (←)"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
<button id="bPlay" aria-label="Pause" title="Pause (Space)"><svg viewBox="0 0 24 24"><path id="iPlay" d="M9 6v12M15 6v12"/></svg></button>
<button id="bNext" aria-label="Next chapter" title="Next chapter (→)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
<div id="dots"></div>
<div id="name">Ayodhya</div>
<button id="bCap" aria-label="Chapter titles" title="Chapter titles (T)"><svg viewBox="0 0 24 24"><path d="M6 7h12M12 7v11"/></svg></button>
<button id="bSnd" class="off" aria-label="Tanpura drone" title="Tanpura drone (M)"><svg viewBox="0 0 24 24"><path d="M5 10v4h3l4 3V7l-4 3H5z"/><path d="M16 9.5a3.5 3.5 0 010 5M18.5 7a7 7 0 010 10"/></svg></button>
<button id="bFs" aria-label="Fullscreen" title="Fullscreen (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<button id="bHelp" aria-label="Keyboard shortcuts" title="Shortcuts (H)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.8 9.6a2.3 2.3 0 114 1.6c-.9.6-1.8 1.1-1.8 2.3M12 16.6v.1"/></svg></button>
<div id="prog"><b></b></div>
</div>
<div id="help" role="dialog" aria-label="Keyboard shortcuts"><h2>Controls</h2>
<div><kbd>Space</kbd>Pause or play</div><div><kbd>←</kbd><kbd>→</kbd>Previous or next chapter</div><div><kbd>1</kbd>to <kbd>9</kbd>Jump to a chapter</div><div><kbd>F</kbd>Fullscreen</div><div><kbd>T</kbd>Chapter titles</div><div><kbd>M</kbd>Tanpura drone</div><div><kbd>Q</kbd>Render quality</div><div><kbd>C</kbd>Fit or fill the screen</div><div><kbd>B</kbd>Painted border</div><div><kbd>S</kbd>Preview at 4× speed</div><div><kbd>H</kbd>Show or hide this panel</div></div>
<div id="toast" aria-live="polite"></div>
<script>
(() => {
'use strict';
/* ===================== core ===================== */
const W = 1920, H = 1080, TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a));
const sm = (a, b, v) => { const t = inv(a, b, v); return t * t * (3 - 2 * t); };
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eout = t => 1 - Math.pow(1 - clamp(t), 3);
const fract = x => x - Math.floor(x);
const hash = n => fract(Math.sin(n * 12.9898 + 78.233) * 43758.5453);

const FLAT = '"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';

/* ===================== sprites ===================== */

function makeFlame() {

  const shape = (s, fill) => { g.beginPath(); g.moveTo(X, Y - 66 * s); g.bezierCurveTo(X + 6 * s, Y - 42 * s, X + 18 * s, Y - 24 * s, X + 18 * s, Y - 8 * s); g.arc(X, Y - 8 * s, 18 * s, 0, PI); g.bezierCurveTo(X - 18 * s, Y - 24 * s, X - 6 * s, Y - 42 * s, X, Y - 66 * s); g.closePath(); g.fillStyle = fill; g.fill(); };

}
function makePetal(a, b) { const cv = mkCanvas(32, 20), g = cv.getContext('2d'); g.fillStyle = RG(g, 13, 8, 16, [[0, css(b)], [1, css(a)]]); g.beginPath(); g.ellipse(16, 10, 14, 8, 0, 0, TAU); g.fill(); return cv; }

function makeMango() { const cv = mkCanvas(24, 64), g = cv.getContext('2d'); g.beginPath(); g.moveTo(12, 0); g.quadraticCurveTo(27, 22, 12, 63); g.quadraticCurveTo(-3, 22, 12, 0); g.fillStyle = LG(g, 0, 0, 24, 0, [[0, '#1f4a22'], [0.5, '#3f7c36'], [1, '#173818']]); g.fill(); g.strokeStyle = 'rgba(200,226,150,0.6)'; g.lineWidth = 1; g.beginPath(); g.moveTo(12, 3); g.lineTo(12, 60); g.stroke(); return cv; }
function makeFlower(c1, c2) { const cv = mkCanvas(32, 32), g = cv.getContext('2d'); for (let k = 0; k < 3; k++) { const r = 14 - k * 4; for (let i = 0; i < 12; i++) { const a = i / 12 * TAU + k * 0.4; g.fillStyle = css(mix(c1, c2, k / 2)); disc(g, [16 + Math.cos(a) * r * 0.55, 16 + Math.sin(a) * r * 0.55], r * 0.5); } } g.fillStyle = css(mix(c2, [120, 40, 0], 0.4)); disc(g, [16, 16], 3); return cv; }

function makeNoise() { const n = 256, cv = mkCanvas(n, n), g = cv.getContext('2d'), id = g.createImageData(n, n), r = rng(9); for (let i = 0; i < n * n; i++) { const v = 128 + (r() - .5) * 96; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; } g.putImageData(id, 0, 0); return cv; }
function makeCloud(w, h, seed, top, bot, kind = 'flat', n = 34) {

function initSprites() {
  SPR.gold = makeGlow([255, 196, 112]); SPR.amber = makeGlow([255, 146, 56]); SPR.white = makeGlow([255, 244, 222]); SPR.red = makeGlow([255, 64, 36]);
  SPR.blue = makeGlow([150, 186, 255]); SPR.rose = makeGlow([255, 140, 160]); SPR.green = makeGlow([206, 255, 140]); SPR.silver = makeGlow([210, 225, 255]);
  SPR.flame = makeFlame();
  SPR.petals = [makePetal([235, 110, 10], [255, 190, 50]), makePetal([180, 16, 46], [250, 90, 110]), makePetal([255, 236, 214], [255, 250, 240]), makePetal([226, 80, 18], [255, 150, 50])];
  SPR.ashokaP = [makePetal([226, 70, 14], [255, 160, 60]), makePetal([200, 40, 20], [255, 120, 50])];
  SPR.leaves = [makeLeaf([40, 80, 30], [120, 170, 70]), makeLeaf([70, 60, 20], [170, 150, 60])];
  SPR.mango = makeMango(); SPR.marigold = makeFlower([228, 104, 8], [255, 182, 36]); SPR.jasmine = makeFlower([232, 226, 210], [255, 255, 250]);

/* ===================== particles & light ===================== */
function glow(g, spr, x, y, r, a = 1) { if (a <= 0.004 || r <= 0) return; const pa = g.globalAlpha; g.globalAlpha = a > 1 ? 1 : a; g.drawImage(spr, x - r, y - r, r * 2, r * 2); g.globalAlpha = pa; }
function flame(g, x, y, h, t, a = 1, seed = 0) { if (h <= 0) return; const f = 0.84 + 0.16 * Math.sin(t * 13 + seed) * Math.sin(t * 7.3 + seed * 1.7), hh = h * f, pa = g.globalAlpha; g.globalAlpha = a; g.drawImage(SPR.flame, x - hh * 0.25, y - hh * 0.875, hh * 0.5, hh); g.globalAlpha = pa; }
function petals(g, t, n, o) {
  const span = o.y1 - o.y0, sp = o.sprites || SPR.petals;
  for (let i = 0; i < n; i++) {
    const h1 = hash(i * 3.17 + o.seed), h2 = hash(i * 7.31 + o.seed), h3 = hash(i * 1.93 + o.seed);

function embers(g, t, n, o) {
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const h1 = hash(i * 5.1 + o.seed), h2 = hash(i * 9.7 + o.seed), h3 = hash(i * 2.3 + o.seed), ph = fract(h1 + t / (o.life * (0.6 + 0.8 * h2)));

  }

}
function fireflies(g, t, n, o) {
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const h1 = hash(i * 4.7 + o.seed), h2 = hash(i * 8.3 + o.seed);

function motes(g, t, n, o) {
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) { const h1 = hash(i * 2.7 + o.seed), h2 = hash(i * 5.3 + o.seed); glow(g, o.spr || SPR.gold, lerp(o.x0, o.x1, h1) + noise(t * 0.08 + i) * 140, lerp(o.y0, o.y1, h2) + noise(t * 0.07 + i + 40) * 100, o.size * (0.5 + h2), (o.alpha ?? 1) * (0.4 + 0.6 * Math.sin(t * 0.9 + i) ** 2)); }

function stars(g, t, n, o) {
  if ((o.alpha ?? 1) <= 0.01) return;

    const h1 = hash(i * 1.7 + o.seed), h2 = hash(i * 3.9 + o.seed), h3 = hash(i * 6.1 + o.seed), x = -300 + h1 * (W + 600), y = Math.pow(h2, 1.5) * o.y1;

function rays(g, x, y, len, n, ang, spread, col, alpha, t, width = 0.04) {

    g.globalAlpha = alpha * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.4 + i * 2.3))) * (0.4 + 0.6 * hash(i * 1.1));
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a0 - w) * len, y + Math.sin(a0 - w) * len); g.lineTo(x + Math.cos(a0 + w) * len, y + Math.sin(a0 + w) * len); g.closePath(); g.fill();
  }
  g.restore();

function burst(g, x, y, age, n, o) {

  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const h1 = hash(i * 3.3 + o.seed), h2 = hash(i * 7.7 + o.seed), h3 = hash(i * 1.3 + o.seed), life = o.life * (0.45 + 0.55 * h3);

  addEventListener('mousemove', showUI); addEventListener('pointerdown', showUI); addEventListener('touchstart', showUI, { passive: true });
  addEventListener('keydown', e => {
    const k = e.key; showUI();
    if (k === ' ') { e.preventDefault(); togglePlay(); } else if (k === 'ArrowRight') go(curChapter() + 1); else if (k === 'ArrowLeft') go(curChapter() - 1);
    else if (k === 'f' || k === 'F') toggleFs(); else if (k === 't' || k === 'T') $('bCap').onclick(); else if (k === 'm' || k === 'M') toggleSound();
    else if (k === 'h' || k === 'H' || k === '?') $('bHelp').onclick(); else if (k === 'b' || k === 'B') { showFrame = !showFrame; toast(showFrame ? 'Border on' : 'Border off'); }
    else if (k === 'c' || k === 'C') { fitCover = !fitCover; resize(); toast(fitCover ? 'Fill screen' : 'Fit screen'); }
    else if (k === 'q' || k === 'Q') { manualQ = true; qIdx = (qIdx + 1) % QUAL.length; resize(); toast('Quality ' + QUAL[qIdx] + 'px'); }

function updateUI() {

  const first = clamp((parseInt(params.get('chapter') || '1', 10) || 1) - 1, 0, SC.length - 1); T = START[first] + TR / 2 + 0.01;
  for (let k = 0; k < SC.length; k++) for (const L of SC[(first + k) % SC.length].layers) if (L.cache) buildQueue.push([SC[(first + k) % SC.length], L]);
  if (testMode) { while (buildQueue.length) { const [sc, L] = buildQueue.shift(); buildLayer(sc, L); } started = true; paused = true; introT = 99; }
  window.RLW = { render(t) { T = t; render(T); }, START, TOTAL, ids: SC.map(s => s.id), errors, ready: true };
  wake(); requestAnimationFrame(frame); if (!testMode) showUI();
}
boot();
})();
